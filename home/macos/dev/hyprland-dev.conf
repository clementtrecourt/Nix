# Config Hyprland minimale pour le banc de test imbriqué (nested.sh).
# Reprend les réglages visuels de la vraie config (home/macos/hyprland.nix) utiles
# pour juger le rendu du shell : flou des surfaces "macos-*", coins, ombres.

decoration {
  rounding = 16
  blur {
    enabled = true
    size = 12
    passes = 4
    noise = 0.02
    contrast = 1.0
    brightness = 1.0
    vibrancy = 0.25
    vibrancy_darkness = 0.2
    popups = true
  }
  shadow {
    enabled = true
    range = 40
    render_power = 2
    color = rgba(00000055)
    offset = 0 12
  }
}

general {
  gaps_in = 0
  gaps_out = 0
  border_size = 0
}

layerrule = blur on, match:namespace ^(macos-.*)$
layerrule = ignore_alpha 0.05, match:namespace ^(macos-.*)$

windowrule = float on, match:class .*
