general {
    hide_cursor = true
    ignore_empty_input = true
}

background {
    monitor =
    path = ~/.local/state/wallpaper
    blur_passes = 3
    blur_size = 7
    brightness = 0.6
}

label {
    monitor =
    text = $TIME
    font_size = 110
    font_family = Readex Pro
    color = rgb({{colors.on_surface.default.hex_stripped}})
    position = 0, 140
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 300, 54
    outline_thickness = 2
    rounding = 14
    dots_center = true
    fade_on_empty = true
    placeholder_text =
    font_family = Readex Pro
    font_color = rgb({{colors.on_surface.default.hex_stripped}})
    inner_color = rgba({{colors.surface.default.hex_stripped}}cc)
    outer_color = rgb({{colors.primary.default.hex_stripped}})
    check_color = rgb({{colors.tertiary.default.hex_stripped}})
    fail_color = rgb({{colors.error.default.hex_stripped}})
    position = 0, -40
    halign = center
    valign = center
}
